# Revisión semanal de dependencias: abre una PR con las actualizaciones (las de seguridad llegan
# aparte, apenas se publica el aviso). Se agrupan las menores y los parches para no llenar el repo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Las versiones mayores (Tailwind 3 a 4, Prisma 5 a 7...) cambian la configuración y la API: se
    # migran a mano, no con una PR automática que rompe el build.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Las versiones mayores (Tailwind 3 a 4, Prisma 5 a 7...) cambian la configuración y la API: se
    # migran a mano, no con una PR automática que rompe el build.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
